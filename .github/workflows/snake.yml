name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *" # Runs every 24 hours
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  push:
    branches:
    - main

permissions:
  contents: write # Essential permission to update the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The line below creates the elite "Radical" color snake animation
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F85D7F&color_dots=#0D1117,#7F3FBF,#7F3FBF,#F85D7F,#F8D866
            
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
