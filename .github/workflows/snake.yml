name: Generate Snake

on:
  schedule:
    - cron: "0 */24 * * *" # Runs every 24 hours
  workflow_dispatch: # Allows manual run in the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write 

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AJAmran
          outputs: |
            # Light Mode Classic Green Snake
            dist/github-contribution-grid-snake.svg?color_snake=#1b5e20&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            
            # Dark Mode Neon Green Terminal Snake
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF00&color_dots=#0D1117,#003900,#008000,#00FF00,#39FF14
            
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
